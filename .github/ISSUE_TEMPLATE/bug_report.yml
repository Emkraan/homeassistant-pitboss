name: Bug Report
description: Report a problem with the PitBoss integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check [existing issues](../../issues) and enable debug logs (see README troubleshooting section).

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: Found in HACS or your `manifest.json`
      placeholder: "2026.4.29"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "2024.6.0"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      options:
        - HACS
        - Manual
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Connection Type
      options:
        - WiFi (WebSocket)
        - Bluetooth LE
    validations:
      required: true

  - type: input
    id: grill_model
    attributes:
      label: Grill Model
      placeholder: "PB1100PSC2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the problem
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: |
        Add the following to `configuration.yaml`, restart HA, reproduce the issue, then paste logs here.
        ```yaml
        logger:
          default: warning
          logs:
            custom_components.pitboss: debug
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I have included debug logs
          required: true
        - label: I am running a supported HA version (2024.1.0+)
          required: true
