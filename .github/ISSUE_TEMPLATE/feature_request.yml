name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't currently possible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds you've tried?

  - type: dropdown
    id: data_source
    attributes:
      label: Data Source
      description: Is this data available locally or only via cloud?
      options:
        - Local (WiFi/BLE)
        - Cloud API
        - Unknown
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Protocol / API Evidence
      description: If you know how the grill exposes this data (packet captures, API docs, etc.), share it here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and discussions
          required: true
